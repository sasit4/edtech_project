{% extends 'base.html' %}
{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg p-4" style="border-radius:15px;">

                <h3 class="text-center mb-2 mt-5 register-heading">
                    Edit Profile
                </h3>

                <form method="POST">
                    {% csrf_token %}

                    <!-- First Name -->
                    <div class="mb-3">
                        <label>First Name</label>
                        <input type="text"
                               name="first_name"
                               class="form-control"
                               value="{{ request.user.first_name }}"
                               placeholder="Enter First Name">
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ request.user.email }}"
                               placeholder="Enter Email">
                    </div>

                    <!-- Button -->
                    <button type="submit"
                            class="btn btn-purple w-100">
                        Save Changes
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
